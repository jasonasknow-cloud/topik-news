    <style>

        :root {
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;

            --trans-bg: #f8fafc;
            --date-bg: #eef5fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);

</head>

<body>

    <header>

        <h1>TOPIK Daily News Reader</h1>

        <p>
            Advanced Korean Reading Practice (Levels 4–6)
        </p>

        <div
            id="archive-count"
            class="archive-count"
        >
            Loading archive...
        </div>

    </header>


    <div class="container">

        <div class="nav-tabs">

            <button
                class="tab-btn active"
                onclick="filterCategory('all', this)"
            >
                All News
            </button>

            <button
                class="tab-btn"
                onclick="filterCategory('정치', this)"
            >
                정치 (Politics)
            </button>

            <button
                class="tab-btn"
                onclick="filterCategory('경제', this)"
            >
                경제 (Business)
            </button>

            <button
                class="tab-btn"
                onclick="filterCategory('사회', this)"
            >
                사회 (Society)
            </button>

            <button
                class="tab-btn"
                onclick="filterCategory('세계', this)"
            >
                세계 (World)
            </button>

        </div>


        <div id="articles-container">

            <div class="loading">
                Loading news archive...
            </div>

        </div>


        <div
            id="load-more-container"
            class="load-more-container"
            style="display: none;"
        >

            <button
                id="load-more-btn"
                class="load-more-btn"
                onclick="loadMoreArticles()"
            >
                Load More Stories
            </button>

        </div>

    </div>


    <footer>
        TOPIK Daily News Reader
    </footer>


    <script>

        let allArticles = [];

        let currentCategory = 'all';

        let displayedCount = 20;

        const ARTICLES_PER_LOAD = 20;


        // ====================================================
        // LOAD NEWS DATA
        // ====================================================

        async function loadNews() {

            try {

                // Add a timestamp to help prevent browsers
                // from displaying an old cached JSON file.
                const cacheBuster = Date.now();

                const response = await fetch(
                    `news_data.json?v=${cacheBuster}`
                );

                if (!response.ok) {
                    throw new Error(
                        'Failed to load news data'
                    );
                }

                allArticles = await response.json();

                if (!Array.isArray(allArticles)) {
                    throw new Error(
                        'News data is not an array'
                    );
                }

                // The Python script already saves the newest
                // articles first. We preserve that order.
                updateArchiveCount();

                renderArticles();

            } catch (error) {

                console.error(
                    'Error loading news:',
                    error
                );

                document.getElementById(
                    'articles-container'
                ).innerHTML = `
                    <div class="empty-state">
                        <p>
                            No articles found yet.
                        </p>
                        <p>
                            Make sure the GitHub Actions
                            workflow has run successfully.
                        </p>
                    </div>
                `;

            }

        }


        // ====================================================
        // UPDATE ARCHIVE COUNT
        // ====================================================

        function updateArchiveCount() {

            const countElement =
                document.getElementById(
                    'archive-count'
                );

            const count = allArticles.length;

            countElement.textContent =
                `${count.toLocaleString()} archived stories`;

        }


        // ====================================================
        // FILTER CURRENT ARTICLES
        // ====================================================

        function getFilteredArticles() {

            if (currentCategory === 'all') {

                return allArticles;

            }

            return allArticles.filter(
                article =>
                    article.category === currentCategory
            );

        }


        // ====================================================
        // FORMAT DATE
        // ====================================================

        function formatDate(dateString) {

            if (!dateString) {
                return 'Unknown date';
            }

            const parts =
                dateString.split('-');

            if (parts.length !== 3) {
                return dateString;
            }

            const year = parts[0];
            const month = parts[1];
            const day = parts[2];

            return `${year}년 ${month}월 ${day}일`;

        }


        // ====================================================
        // FORMAT TIME
        // ====================================================

        function formatTime(article) {

            // New archive entries contain published_at.
            if (article.published_at) {

                const parts =
                    article.published_at.split(' ');

                if (parts.length >= 2) {

                    return parts[1];

                }

                return article.published_at;

            }

            // Older articles may not contain a time.
            return '';

        }


        // ====================================================
        // ESCAPE HTML
        // ====================================================

        function escapeHtml(value) {

            if (value === null ||
                value === undefined) {
                return '';
            }

            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

        }


        // ====================================================
        // RENDER ARTICLES
        // ====================================================

        function renderArticles() {

            const container =
                document.getElementById(
                    'articles-container'
                );

            const loadMoreContainer =
                document.getElementById(
                    'load-more-container'
                );

            const loadMoreButton =
                document.getElementById(
                    'load-more-btn'
                );

            const filteredArticles =
                getFilteredArticles();

            if (
                !filteredArticles ||
                filteredArticles.length === 0
            ) {

                container.innerHTML = `
                    <div class="empty-state">
                        <p>
                            No articles available
                            for this category.
                        </p>
                    </div>
                `;

                loadMoreContainer.style.display =
                    'none';

                return;
            }


            const visibleArticles =
                filteredArticles.slice(
                    0,
                    displayedCount
                );


            // Group stories by date.
            const groups = {};

            visibleArticles.forEach(article => {

                const date =
                    article.date || 'Unknown';

                if (!groups[date]) {
                    groups[date] = [];
                }

                groups[date].push(article);

            });


            let html = '';


            Object.keys(groups).forEach(date => {

                const articlesForDate =
                    groups[date];

                html += `
                    <section class="date-section">

                        <div class="date-heading">

                            <h2>
                                ${escapeHtml(
                                    formatDate(date)
                                )}
                            </h2>

                            <span class="story-count">
                                ${articlesForDate.length}
                                ${articlesForDate.length === 1
                                    ? 'story'
                                    : 'stories'}
                            </span>

                        </div>
                `;


                articlesForDate.forEach(article => {

                    const category =
                        escapeHtml(
                            article.category
                        );

                    const title =
                        escapeHtml(
                            article.title
                        );

                    const body =
                        escapeHtml(
                            article.body
                        ).replace(
                            /\n/g,
                            '<br>'
                        );

                    const vocabulary =
                        article.vocab
                            ? escapeHtml(
                                article.vocab
                            )
                            : '';

                    const translation =
                        article.translation
                            ? escapeHtml(
                                article.translation
                            ).replace(
                                /\n/g,
                                '<br>'
                            )
                            : '';

                    const time =
                        formatTime(article);


                    html += `
                        <article class="news-card">

                            <div class="news-meta">

                                <span class="news-category">
                                    ${category}
                                </span>

                                ${
                                    time
                                    ? `
                                        <span class="news-time">
                                            ${escapeHtml(time)}
                                        </span>
                                      `
                                    : ''
                                }

                            </div>


                            <h2 class="news-title">
                                ${title}
                            </h2>


                            <div class="news-body">
                                <p>
                                    ${body}
                                </p>
                            </div>


                            ${
                                vocabulary
                                ? `
                                    <div class="vocab-section">

                                        <strong>
                                            Key Vocabulary:
                                        </strong>

                                        <br>

                                        ${vocabulary}

                                    </div>
                                  `
                                : ''
                            }


                            ${
                                translation
                                ? `
                                    <button
                                        class="toggle-trans-btn"
                                        onclick="toggleTranslation(this)"
                                    >
                                        Toggle Translation
                                    </button>

                                    <div class="translation-box">

                                        <p>
                                            ${translation}
                                        </p>

                                    </div>
                                  `
                                : ''
                            }

                        </article>
                    `;

                });


                html += `
                    </section>
                `;

            });


            container.innerHTML = html;


            // Decide whether the Load More button
            // should be displayed.
            if (
                visibleArticles.length <
                filteredArticles.length
            ) {

                loadMoreContainer.style.display =
                    'block';

                loadMoreButton.textContent =
                    `Load More Stories ` +
                    `(${filteredArticles.length - visibleArticles.length} remaining)`;

            } else {

                loadMoreContainer.style.display =
                    'none';

            }

        }


        // ====================================================
        // FILTER CATEGORY
        // ====================================================

        function filterCategory(
            category,
            button
        ) {

            currentCategory = category;

            displayedCount = ARTICLES_PER_LOAD;

            const buttons =
                document.querySelectorAll(
                    '.tab-btn'
                );

            buttons.forEach(
                btn =>
                    btn.classList.remove('active')
            );

            button.classList.add('active');

            renderArticles();

            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });

        }


        // ====================================================
        // LOAD MORE STORIES
        // ====================================================

        function loadMoreArticles() {

            displayedCount +=
                ARTICLES_PER_LOAD;

            renderArticles();

        }


        // ====================================================
        // TRANSLATION TOGGLE
        // ====================================================

        function toggleTranslation(button) {

            const transBox =
                button.nextElementSibling;

            if (
                transBox.style.display ===
                'block'
            ) {

                transBox.style.display =
                    'none';

                button.textContent =
                    'Toggle Translation';

            } else {

                transBox.style.display =
                    'block';

                button.textContent =
                    'Hide Translation';

            }

        }


        // ====================================================
        // START
        // ====================================================

        window.addEventListener(
            'DOMContentLoaded',
            loadNews
        );

    </script>

</body>

</html>
