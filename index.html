<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TOPIK News Study</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f5f7fa;
            --card-color: #ffffff;
            --text-color: #222222;
            --muted-color: #777777;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --border-color: #e5e7eb;
            --green-color: #15803d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Noto Sans KR", Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
        }

        .container {
            width: min(100% - 32px, 900px);
            margin: 0 auto;
        }

        header {
            background: var(--card-color);
            border-bottom: 1px solid var(--border-color);
            padding: 28px 0 22px;
        }

        header h1 {
            margin: 0 0 6px;
            font-size: 2rem;
        }

        header p {
            margin: 0;
            color: var(--muted-color);
            font-size: 0.95rem;
        }

        .header-links {
            margin-top: 14px;
        }

        .header-links a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
        }

        .header-links a:hover {
            text-decoration: underline;
        }

        .category-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 24px 0;
        }

        .category-btn {
            border: 1px solid var(--border-color);
            background: white;
            color: #444;
            padding: 8px 14px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .category-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .category-btn.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .archive-count {
            color: var(--muted-color);
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        .news-card {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 7px rgba(0, 0, 0, 0.03);
        }

        .news-meta {
            color: var(--muted-color);
            font-size: 0.82rem;
            margin-bottom: 8px;
        }

        .news-title {
            font-size: 1.45rem;
            line-height: 1.45;
            margin: 0 0 16px;
        }

        .audio-controls {
            display: flex;
            gap: 7px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .audio-btn {
            border: 1px solid var(--border-color);
            background: white;
            color: #333;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.84rem;
        }

        .audio-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .speed-select {
            border: 1px solid var(--border-color);
            background: white;
            padding: 7px 9px;
            border-radius: 6px;
            font-size: 0.84rem;
        }

        .news-body {
            font-size: 1.02rem;
            line-height: 1.9;
        }

        .news-body p {
            margin: 0;
        }

        /* Select Korean text button */
        .select-text-btn {
            margin-top: 14px;
            margin-bottom: 20px;
            border: 1px solid var(--accent-color);
            background: white;
            color: var(--accent-color);
            padding: 7px 13px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .select-text-btn:hover {
            background: var(--accent-color);
            color: white;
        }

        .vocab-section {
            margin-top: 8px;
            padding-top: 18px;
            border-top: 1px solid var(--border-color);
        }

        .vocab-section h3 {
            margin: 0 0 12px;
            font-size: 1rem;
        }

        .vocab-list {
            margin: 0;
            padding-left: 22px;
        }

        .vocab-list li {
            margin-bottom: 7px;
        }

        .vocab-text {
            white-space: pre-line;
            line-height: 1.8;
            margin: 0;
        }

        .translation-toggle {
            margin-top: 18px;
        }

        .translation-btn {
            border: 1px solid var(--border-color);
            background: white;
            color: #444;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.84rem;
        }

        .translation-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .translation-box {
            margin-top: 12px;
            padding: 16px;
            background: #f8fafc;
            border-left: 3px solid var(--accent-color);
            border-radius: 5px;
            line-height: 1.8;
        }

        .load-more-container {
            text-align: center;
            margin: 28px 0 50px;
        }

        .load-more-btn {
            border: 1px solid var(--accent-color);
            background: var(--accent-color);
            color: white;
            padding: 10px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .load-more-btn:hover {
            background: var(--accent-hover);
        }

        .loading,
        .error-message {
            text-align: center;
            padding: 50px 20px;
            color: var(--muted-color);
        }

        .error-message {
            color: #b91c1c;
        }

        footer {
            border-top: 1px solid var(--border-color);
            padding: 28px 0;
            color: var(--muted-color);
            font-size: 0.8rem;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                width: min(100% - 22px, 900px);
            }

            header h1 {
                font-size: 1.65rem;
            }

            .news-card {
                padding: 18px;
            }

            .news-title {
                font-size: 1.25rem;
            }

            .news-body {
                font-size: 0.98rem;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="container">
        <h1>TOPIK News Study</h1>
        <p>Learn Korean through current news articles.</p>

        <div class="header-links">
            <a href="convert.html">→ Convert Your Own Article</a>
        </div>
    </div>
</header>

<main class="container">

  <div class="category-tabs">
    <button class="category-btn active" data-category="all">
        All
    </button>

    <button class="category-btn" data-category="정치">
        Politics
    </button>

    <button class="category-btn" data-category="경제">
        Economy
    </button>

    <button class="category-btn" data-category="사회">
        Society
    </button>

    <button class="category-btn" data-category="세계">
        World
    </button>
</div>

    <div id="archive-count" class="archive-count"></div>

    <div id="articles-container">
        <div class="loading">
            Loading news...
        </div>
    </div>

    <div class="load-more-container">
        <button
            id="load-more-btn"
            class="load-more-btn"
            style="display:none;"
        >
            Load More
        </button>
    </div>

</main>

<footer>
    TOPIK News Study
</footer>

<script>
    let allArticles = [];
    let filteredArticles = [];
    let currentCategory = "all";
    let displayedCount = 10;

    let speechSupported = "speechSynthesis" in window;
    let availableVoices = [];
    let currentUtterance = null;

    /*
     * Load available speech voices.
     */
    function loadSpeechVoices() {
        if (!speechSupported) {
            return;
        }

        availableVoices = speechSynthesis.getVoices();
    }

    if (speechSupported) {
        loadSpeechVoices();

        speechSynthesis.onvoiceschanged = function () {
            loadSpeechVoices();
        };
    }

    /*
     * Find the best Korean voice available to the browser.
     */
    function getKoreanVoice() {
        if (!availableVoices.length) {
            return null;
        }

        const koreanVoices = availableVoices.filter(function (voice) {
            return voice.lang &&
                voice.lang.toLowerCase().startsWith("ko");
        });

        if (!koreanVoices.length) {
            return null;
        }

        const preferredNames = [
            "Yuna",
            "Sora",
            "Google 한국의",
            "Google Korean",
            "Korean"
        ];

        for (const preferred of preferredNames) {
            const found = koreanVoices.find(function (voice) {
                return voice.name.toLowerCase().includes(
                    preferred.toLowerCase()
                );
            });

            if (found) {
                return found;
            }
        }

        return koreanVoices[0];
    }

    /*
     * Speak an article.
     */
    function speakArticle(articleId, text, button) {
        if (!speechSupported) {
            alert("Your browser does not support text-to-speech.");
            return;
        }

        speechSynthesis.cancel();

        const speedSelect = document.getElementById(
            articleId + "-speed"
        );

        const speed = speedSelect
            ? parseFloat(speedSelect.value)
            : 1;

        currentUtterance = new SpeechSynthesisUtterance(text);

        currentUtterance.lang = "ko-KR";
        currentUtterance.rate = speed;
        currentUtterance.pitch = 1;

        const koreanVoice = getKoreanVoice();

        if (koreanVoice) {
            currentUtterance.voice = koreanVoice;
        }

        currentUtterance.onend = function () {
            if (button) {
                button.textContent = "▶ Listen";
            }
        };

        currentUtterance.onerror = function () {
            if (button) {
                button.textContent = "▶ Listen";
            }
        };

        speechSynthesis.speak(currentUtterance);

        if (button) {
            button.textContent = "🔊 Playing";
        }
    }

    /*
     * Pause speech.
     */
    function pauseSpeech() {
        if (speechSupported) {
            speechSynthesis.pause();
        }
    }

    /*
     * Resume speech.
     */
    function resumeSpeech() {
        if (speechSupported) {
            speechSynthesis.resume();
        }
    }

    /*
     * Stop speech.
     */
    function stopSpeech() {
        if (speechSupported) {
            speechSynthesis.cancel();
        }

        currentUtterance = null;
    }

    /*
     * Select the Korean article text so the user can use
     * the phone's native text-to-speech controls.
     *
     * On iPhone, after selecting the text, the user can
     * choose Play from the native selection menu.
     */
    function selectArticleText(elementId, button) {
        const articleElement = document.getElementById(elementId);

        if (!articleElement) {
            return;
        }

        const selection = window.getSelection();
        const range = document.createRange();

        range.selectNodeContents(articleElement);

        selection.removeAllRanges();
        selection.addRange(range);

        if (button) {
            button.textContent = "✓ Korean Text Selected";

            setTimeout(function () {
                button.textContent = "📋 Select All Korean";
            }, 1500);
        }
    }

    /*
     * Escape HTML so generated article text is safe to display.
     */
    function escapeHtml(text) {
        if (text === null || text === undefined) {
            return "";
        }

        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    /*
     * Format article date.
     */
function formatDate(dateValue, publishedAt) {
    if (publishedAt) {
        return publishedAt;
    }

    if (!dateValue) {
        return "";
    }

    const date = new Date(dateValue);

    if (Number.isNaN(date.getTime())) {
        return dateValue;
    }

    return date.toLocaleDateString("ko-KR", {
        year: "numeric",
        month: "long",
        day: "numeric"
    });
}

    /*
     * Toggle English translation.
     */
    function toggleTranslation(articleId) {
        const box = document.getElementById(
            articleId + "-translation"
        );

        const button = document.getElementById(
            articleId + "-translation-btn"
        );

        if (!box || !button) {
            return;
        }

        if (box.style.display === "none") {
            box.style.display = "block";
            button.textContent = "Hide English Translation";
        } else {
            box.style.display = "none";
            button.textContent = "Show English Translation";
        }
    }

    /*
     * Render articles.
     */
    function renderArticles() {
        const container = document.getElementById(
            "articles-container"
        );

        if (!container) {
            return;
        }

        if (!filteredArticles.length) {
            container.innerHTML = `
                <div class="loading">
                    No articles found.
                </div>
            `;

            document.getElementById(
                "load-more-btn"
            ).style.display = "none";

            return;
        }

        const articlesToShow = filteredArticles.slice(
            0,
            displayedCount
        );

        container.innerHTML = articlesToShow.map(function (article, index) {

            const articleId =
                "article-" +
                index +
                "-" +
                Math.random().toString(36).substring(2, 8);

            const title = escapeHtml(
                article.title || "Untitled Article"
            );

            const body = escapeHtml(
                article.body || article.content || ""
            ).replace(/\n/g, "<br>");

            const translation = escapeHtml(
                article.translation ||
                article.english_translation ||
                ""
            ).replace(/\n/g, "<br>");

            let vocabularyHtml = "";

            /*
             * Support both the original "vocab" text field
             * and the newer "vocabulary" array format.
             */
            const rawVocabulary =
                article.vocab !== undefined &&
                article.vocab !== null &&
                article.vocab !== ""
                    ? article.vocab
                    : article.vocabulary;

            if (
                rawVocabulary &&
                Array.isArray(rawVocabulary) &&
                rawVocabulary.length
            ) {
                vocabularyHtml = `
                    <div class="vocab-section">
                        <h3>Key Vocabulary</h3>

                        <ul class="vocab-list">
                            ${rawVocabulary.map(function (item) {

                                if (typeof item === "string") {
                                    return `
                                        <li>
                                            ${escapeHtml(item)}
                                        </li>
                                    `;
                                }

                                const word = escapeHtml(
                                    item.word || ""
                                );

                                const meaning = escapeHtml(
                                    item.meaning ||
                                    item.definition ||
                                    ""
                                );

                                return `
                                    <li>
                                        <strong>${word}</strong>
                                        ${
                                            meaning
                                                ? " — " + meaning
                                                : ""
                                        }
                                    </li>
                                `;
                            }).join("")}
                        </ul>
                    </div>
                `;
            } else if (
                typeof rawVocabulary === "string" &&
                rawVocabulary.trim()
            ) {
                vocabularyHtml = `
                    <div class="vocab-section">
                        <h3>Key Vocabulary</h3>

                        <div class="vocab-text">
                            ${escapeHtml(rawVocabulary.trim())}
                        </div>
                    </div>
                `;
            }

            let translationHtml = "";

            if (translation) {
                translationHtml = `
                    <div class="translation-toggle">

                        <button
                            id="${articleId}-translation-btn"
                            class="translation-btn"
                            onclick="toggleTranslation('${articleId}')"
                        >
                            Show English Translation
                        </button>

                        <div
                            id="${articleId}-translation"
                            class="translation-box"
                            style="display:none;"
                        >
                            ${translation}
                        </div>

                    </div>
                `;
            }

            return `
                <article class="news-card">

                    <div class="news-meta">
                        ${
                            article.category
                                ? escapeHtml(article.category)
                                : ""
                        }

                        ${
                           article.published_at || article.date
    ? " · " + formatDate(article.date, article.published_at)
    : ""
                        }
                    </div>

                    <h2 class="news-title">
                        ${title}
                    </h2>

                    <div class="audio-controls">

                        <button
                            class="audio-btn"
                            onclick="
                                speakArticle(
                                    '${articleId}',
                                    document.getElementById('${articleId}-text').innerText,
                                    this
                                )
                            "
                        >
                            ▶ Listen
                        </button>

                        <button
                            class="audio-btn"
                            onclick="pauseSpeech()"
                        >
                            ⏸ Pause
                        </button>

                        <button
                            class="audio-btn"
                            onclick="resumeSpeech()"
                        >
                            ▶ Resume
                        </button>

                        <button
                            class="audio-btn"
                            onclick="stopSpeech()"
                        >
                            ■ Stop
                        </button>

                        <select
                            id="${articleId}-speed"
                            class="speed-select"
                        >
                            <option value="0.75">0.75×</option>
                            <option value="0.9">0.9×</option>
                            <option value="1" selected>1×</option>
                            <option value="1.15">1.15×</option>
                            <option value="1.25">1.25×</option>
                            <option value="1.5">1.5×</option>
                        </select>

                    </div>

                    <div
                        id="${articleId}-text"
                        class="news-body"
                    >
                        <p>
                            ${body}
                        </p>
                    </div>

                    <button
                        class="select-text-btn"
                        onclick="selectArticleText('${articleId}-text', this)"
                    >
                        📋 Select All Korean
                    </button>

                    ${vocabularyHtml}

                    ${translationHtml}

                </article>
            `;
        }).join("");

        const loadMoreButton = document.getElementById(
            "load-more-btn"
        );

        if (displayedCount < filteredArticles.length) {
            loadMoreButton.style.display = "inline-block";
        } else {
            loadMoreButton.style.display = "none";
        }
    }

    /*
     * Update archive count.
     */
    function updateArchiveCount() {
        const countElement = document.getElementById(
            "archive-count"
        );

        if (!countElement) {
            return;
        }

        countElement.textContent =
            allArticles.length +
            " archived articles";
    }

    /*
     * Load news data.
     */
    async function loadNews() {
        const container = document.getElementById(
            "articles-container"
        );

        try {
            const response = await fetch(
                "news_data.json?" + Date.now()
            );

            if (!response.ok) {
                throw new Error(
                    "Failed to load news data."
                );
            }

            const data = await response.json();

            if (Array.isArray(data)) {
                allArticles = data;
            } else if (Array.isArray(data.articles)) {
                allArticles = data.articles;
            } else {
                allArticles = [];
            }

            updateArchiveCount();

            filteredArticles = allArticles;

            renderArticles();

        } catch (error) {
            console.error(error);

            container.innerHTML = `
                <div class="error-message">
                    Unable to load the news articles.
                    Please try again later.
                </div>
            `;
        }
    }

    /*
     * Category filtering.
     */
    document.querySelectorAll(".category-btn").forEach(
        function (button) {

            button.addEventListener("click", function () {

                document
                    .querySelectorAll(".category-btn")
                    .forEach(function (btn) {
                        btn.classList.remove("active");
                    });

                button.classList.add("active");

                currentCategory =
                    button.dataset.category;

                displayedCount = 10;

                if (currentCategory === "all") {

                    filteredArticles = allArticles;

                } else {

                    filteredArticles =
                        allArticles.filter(function (article) {

                            return String(
                                article.category || ""
                            ).toLowerCase() ===
                            currentCategory.toLowerCase();

                        });

                }

                renderArticles();
            });
        }
    );

    /*
     * Load more.
     */
    document
        .getElementById("load-more-btn")
        .addEventListener("click", function () {

            displayedCount += 10;

            renderArticles();
        });

    /*
     * Initial load.
     */
    loadNews();
</script>

</body>
</html>
