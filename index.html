    </style>
</head>

<body>

<header>
    <div class="container">
        <h1>Jason's TOPIK News Study</h1>
        <p>Learn Korean through current news articles.</p>

        <div class="header-links">
            <a href="convert.html">→ Convert Your Own Article</a>
        </div>
    </div>
</header>

<main class="container">

  <div class="category-tabs">
    <button class="category-btn active" data-category="all">
        All
    </button>

    <button class="category-btn" data-category="정치">
        Politics
    </button>

    <button class="category-btn" data-category="경제">
        Economy
    </button>

    <button class="category-btn" data-category="사회">
        Society
    </button>

    <button class="category-btn" data-category="세계">
        World
    </button>

    <button class="category-btn" data-category="converted">
        Converted
    </button>
</div>

    <div id="archive-count" class="archive-count"></div>

    <div id="articles-container">
        <div class="loading">
            Loading news...
        </div>
    </div>

    <div class="load-more-container">
        <button
            id="load-more-btn"
            class="load-more-btn"
            style="display:none;"
        >
            Load More
        </button>
    </div>

</main>

<footer>
    TOPIK News Study
</footer>

<script>
    let allArticles = [];
    let convertedArticles = [];
    let filteredArticles = [];
    let currentCategory = "all";
    let displayedCount = 10;

    // How many opening sentences to use in the Sentence Order exercise.
    const ORDER_SENTENCE_COUNT = 5;

    // Milliseconds to wait after a correct quiz answer before the next question.
    const QUIZ_ADVANCE_MS = 900;

    // State of each article's practice exercises.
    let orderState = {};
    let matchState = {};
    let flashState = {};
    let quizState = {};
    let fillState = {};

    // Which tabs each article has, and which one is showing.
    let practiceKeys = {};
    let practiceCurrent = {};

    // The quiz that keyboard keys 1-4 apply to.
    let activeQuizId = null;

    let speechSupported = "speechSynthesis" in window;
    let availableVoices = [];
    let currentUtterance = null;

    function loadSpeechVoices() {
        if (!speechSupported) {
            return;
        }
        availableVoices = speechSynthesis.getVoices();
    }

    if (speechSupported) {
        loadSpeechVoices();
        speechSynthesis.onvoiceschanged = function () {
            loadSpeechVoices();
        };
    }

    function getKoreanVoice() {
        if (!availableVoices.length) {
            return null;
        }

        const koreanVoices = availableVoices.filter(function (voice) {
            return voice.lang &&
                voice.lang.toLowerCase().startsWith("ko");
        });

        if (!koreanVoices.length) {
            return null;
        }

        const preferredNames = [
            "Yuna",
            "Sora",
            "Google 한국의",
            "Google Korean",
            "Korean"
        ];

        for (const preferred of preferredNames) {
            const found = koreanVoices.find(function (voice) {
                return voice.name.toLowerCase().includes(
                    preferred.toLowerCase()
                );
            });

            if (found) {
                return found;
            }
        }

        return koreanVoices[0];
    }

    function speakArticle(articleId, text, button) {
        if (!speechSupported) {
            alert("Your browser does not support text-to-speech.");
            return;
        }

        speechSynthesis.cancel();

        const speedSelect = document.getElementById(
            articleId + "-speed"
        );

        const speed = speedSelect
            ? parseFloat(speedSelect.value)
            : 1;

        currentUtterance = new SpeechSynthesisUtterance(text);

        currentUtterance.lang = "ko-KR";
        currentUtterance.rate = speed;
        currentUtterance.pitch = 1;

        const koreanVoice = getKoreanVoice();

        if (koreanVoice) {
            currentUtterance.voice = koreanVoice;
        }

        currentUtterance.onend = function () {
            if (button) {
                button.textContent = "▶ Listen";
            }
        };

        currentUtterance.onerror = function () {
            if (button) {
                button.textContent = "▶ Listen";
            }
        };

        speechSynthesis.speak(currentUtterance);

        if (button) {
            button.textContent = "🔊 Playing";
        }
    }

    function pauseSpeech() {
        if (speechSupported) {
            speechSynthesis.pause();
        }
    }

    function resumeSpeech() {
        if (speechSupported) {
            speechSynthesis.resume();
        }
    }

    function stopSpeech() {
        if (speechSupported) {
            speechSynthesis.cancel();
        }

        currentUtterance = null;
    }

    function selectArticleText(elementId, button) {
        const articleElement = document.getElementById(elementId);

        if (!articleElement) {
            return;
        }

        const selection = window.getSelection();
        const range = document.createRange();

        range.selectNodeContents(articleElement);

        selection.removeAllRanges();
        selection.addRange(range);

        if (button) {
            button.textContent = "✓ Korean Text Selected";

            setTimeout(function () {
                button.textContent = "📋 Select All Korean";
            }, 1500);
        }
    }

    function escapeHtml(text) {
        if (text === null || text === undefined) {
            return "";
        }

        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function parseVocabLine(line) {
        const clean = String(line || "")
            .replace(/^\s*(\d+[.)]|[-•*])\s*/, "")
            .replace(/\*\*/g, "")
            .trim();

        if (!clean) {
            return null;
        }

        // Style: word — meaning  /  word - meaning  /  word: meaning
        const sep = clean.match(/^(.+?)\s*(?::|：|\s[-–—]\s|—|–)\s*(.+)$/);

        if (sep) {
            return {
                word: sep[1].trim(),
                meaning: sep[2].trim()
            };
        }

        // Style: word (meaning)
        const paren = clean.match(/^(.+?)\s*[(（]\s*(.+?)\s*[)）]\s*$/);

        if (paren) {
            return {
                word: paren[1].trim(),
                meaning: paren[2].trim()
            };
        }

        return { word: clean, meaning: "" };
    }

    /*
     * Turns an article's vocab (list of objects, list of strings, or one
     * text block) into a clean list of:
     *   { word, meaning, example_ko, example_en }
     * Old articles simply have empty example fields.
     */
    function getVocabItems(article) {
        const raw =
            article.vocab !== undefined &&
            article.vocab !== null &&
            article.vocab !== ""
                ? article.vocab
                : article.vocabulary;

        let items = [];

        if (Array.isArray(raw)) {
            raw.forEach(function (entry) {
                if (typeof entry === "string") {
                    const parsed = parseVocabLine(entry);

                    if (parsed) {
                        items.push({
                            word: parsed.word,
                            meaning: parsed.meaning,
                            example_ko: "",
                            example_en: ""
                        });
                    }
                } else if (entry && typeof entry === "object") {
                    items.push({
                        word: String(entry.word || "").trim(),
                        meaning: String(
                            entry.meaning || entry.definition || ""
                        ).trim(),
                        example_ko: String(
                            entry.example_ko || entry.example || ""
                        ).trim(),
                        example_en: String(entry.example_en || "").trim()
                    });
                }
            });
        } else if (typeof raw === "string" && raw.trim()) {
            raw.trim().split("\n").forEach(function (line) {
                const parsed = parseVocabLine(line);

                if (parsed) {
                    items.push({
                        word: parsed.word,
                        meaning: parsed.meaning,
                        example_ko: "",
                        example_en: ""
                    });
                }
            });
        }

        return items.filter(function (item) {
            return item.word;
        });
    }

    // Example sentence with the [bracketed] target word shown in bold.
    function exampleHtml(text) {
        return escapeHtml(text).replace(
            /\[([^\]]+)\]/g,
            "<strong>$1</strong>"
        );
    }

    function formatDate(dateValue, publishedAt) {
        if (publishedAt) {
            return publishedAt;
        }

        if (!dateValue) {
            return "";
        }

        const date = new Date(dateValue);

        if (Number.isNaN(date.getTime())) {
            return dateValue;
        }

        return date.toLocaleDateString("ko-KR", {
            year: "numeric",
            month: "long",
            day: "numeric"
        });
    }

    // Label shown in the small line above each title.
    function categoryLabel(category) {
        if (String(category || "").toLowerCase() === "converted") {
            return "Converted";
        }

        return category || "";
    }

    function toggleTranslation(articleId) {
        const box = document.getElementById(
            articleId + "-translation"
        );

        const button = document.getElementById(
            articleId + "-translation-btn"
        );

        if (!box || !button) {
            return;
        }

        if (box.style.display === "none") {
            box.style.display = "block";
            button.textContent = "Hide English Translation";
        } else {
            box.style.display = "none";
            button.textContent = "Show English Translation";
        }
    }

    function toggleExamples(articleId) {
        const box = document.getElementById(articleId + "-examples");
        const button = document.getElementById(articleId + "-examples-btn");

        if (!box || !button) {
            return;
        }

        if (box.style.display === "none") {
            box.style.display = "block";
            button.textContent = "Hide Example Sentences";
        } else {
            box.style.display = "none";
            button.textContent = "Show Example Sentences";
        }
    }

    /*
     * ---------- Shared helpers ----------
     */

    function shuffleArray(arr) {
        const copy = arr.slice();

        for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const temp = copy[i];
            copy[i] = copy[j];
            copy[j] = temp;
        }

        return copy;
    }

    // Reorders a list so the same word is not asked twice in a row.
    function separateNeighbors(list) {
        for (let i = 1; i < list.length; i++) {
            if (list[i].id === list[i - 1].id) {
                for (let j = i + 1; j < list.length; j++) {
                    if (list[j].id !== list[i - 1].id) {
                        const temp = list[i];
                        list[i] = list[j];
                        list[j] = temp;
                        break;
                    }
                }
            }
        }

        return list;
    }

    // Items that have both a word and a meaning, with simple numeric IDs.
    function usableVocab(items) {
        return items
            .filter(function (item) {
                return item.word && item.meaning;
            })
            .map(function (item, i) {
                return {
                    id: i,
                    word: item.word,
                    meaning: item.meaning,
                    example_ko: item.example_ko || "",
                    example_en: item.example_en || ""
                };
            });
    }

    /*
     * ---------- Practice panel (tabs) ----------
     */

    function togglePractice(articleId) {
        const panel = document.getElementById(articleId + "-practice");
        const button = document.getElementById(articleId + "-practice-btn");

        if (!panel || !button) {
            return;
        }

        if (panel.style.display === "none") {
            panel.style.display = "block";
            button.textContent = "Hide Practice";

            const keys = practiceKeys[articleId] || [];
            const current = practiceCurrent[articleId] || keys[0];

            if (current) {
                showPracticeTab(articleId, current);
            }
        } else {
            panel.style.display = "none";
            button.textContent = "🎯 Practice";

            if (activeQuizId === articleId) {
                activeQuizId = null;
            }
        }
    }

    function showPracticeTab(articleId, key) {
        const keys = practiceKeys[articleId] || [];

        keys.forEach(function (k) {
            const box = document.getElementById(articleId + "-" + k);
            const tab = document.getElementById(articleId + "-tab-" + k);

            if (box) {
                box.style.display = k === key ? "block" : "none";
            }

            if (tab) {
                tab.classList.toggle("active", k === key);
            }
        });

        practiceCurrent[articleId] = key;
        activeQuizId = key === "quiz" ? articleId : null;

        if (key === "order") {
            if (!orderState[articleId].current) {
                shuffleForOrder(articleId);
            }
            renderOrderExercise(articleId);
        } else if (key === "match") {
            if (!matchState[articleId].leftOrder) {
                shuffleMatch(articleId);
            }
            renderMatchExercise(articleId);
        } else if (key === "flash") {
            if (!flashState[articleId].deck) {
                startFlash(articleId);
            }
            renderFlash(articleId);
        } else if (key === "quiz") {
            if (!quizState[articleId].questions) {
                startQuiz(articleId, null);
            }
            renderQuiz(articleId);
        } else if (key === "fill") {
            if (!fillState[articleId].order) {
                startFill(articleId);
            }
            renderFill(articleId);
        }
    }

    /*
     * ---------- Sentence Order Exercise ----------
     */

    function splitKoreanSentences(text) {
        return String(text || "")
            .replace(/\s+/g, " ")
            .trim()
            .split(/(?<=[.!?])\s+/)
            .filter(Boolean);
    }

    function shuffleForOrder(articleId) {
        const state = orderState[articleId];

        if (!state) {
            return;
        }

        const first = state.correct[0];
        const rest = state.correct.slice(1);

        let shuffled = rest.slice();
        let attempts = 0;

        do {
            shuffled = shuffleArray(shuffled);
            attempts++;
        } while (
            attempts < 20 &&
            shuffled.length > 1 &&
            shuffled.every(function (s, i) {
                return s === rest[i];
            })
        );

        state.current = [first].concat(shuffled);
        state.selected = null;
        state.checked = false;
    }

    function renderOrderExercise(articleId) {
        const state = orderState[articleId];
        const box = document.getElementById(articleId + "-order");

        if (!state || !box) {
            return;
        }

        let html = `
            <p class="order-help">
                The first sentence is fixed. Click one sentence, then click
                another to swap them. Put the sentences in the correct order.
            </p>
            <div class="order-fixed">
                <span class="order-label">1</span>${escapeHtml(state.current[0])}
            </div>
        `;

        let correctCount = 0;

        for (let i = 1; i < state.current.length; i++) {
            let className = "order-item";

            if (state.checked) {
                if (state.current[i] === state.correct[i]) {
                    className += " correct";
                    correctCount++;
                } else {
                    className += " wrong";
                }
            } else if (state.selected === i) {
                className += " selected";
            }

            const clickAttr = state.checked
                ? ""
                : `onclick="selectOrderItem('${articleId}', ${i})"`;

            html += `
                <div class="${className}" ${clickAttr}>
                    <span class="order-label">${i + 1}</span>${escapeHtml(state.current[i])}
                </div>
            `;
        }

        html += `
            <div class="order-actions">
                <button class="translation-btn" onclick="checkOrder('${articleId}')">
                    ✓ Check Order
                </button>
                <button class="translation-btn" onclick="restartOrder('${articleId}')">
                    🔀 Shuffle Again
                </button>
            </div>
        `;

        if (state.checked) {
            const total = state.current.length - 1;

            let message;

            if (correctCount === total) {
                message = "🎉 Perfect! All sentences are in the correct order.";
            } else {
                message = "You placed " + correctCount + " of " + total +
                    " sentences correctly.";
            }

            html += `<div class="order-result">${message}</div>`;

            html += `
                <div class="order-answer">
                    <strong>Correct order:</strong>
                    ${state.correct.map(function (s, i) {
                        return `<div><span class="order-label">${i + 1}</span>${escapeHtml(s)}</div>`;
                    }).join("")}
                </div>
            `;
        }

        box.innerHTML = html;
    }

    function selectOrderItem(articleId, index) {
        const state = orderState[articleId];

        if (!state || state.checked) {
            return;
        }

        if (state.selected === null) {
            state.selected = index;
        } else if (state.selected === index) {
            state.selected = null;
        } else {
            const temp = state.current[state.selected];
            state.current[state.selected] = state.current[index];
            state.current[index] = temp;
            state.selected = null;
        }

        renderOrderExercise(articleId);
    }

    function checkOrder(articleId) {
        const state = orderState[articleId];

        if (!state) {
            return;
        }

        state.checked = true;
        state.selected = null;

        renderOrderExercise(articleId);
    }

    function restartOrder(articleId) {
        shuffleForOrder(articleId);
        renderOrderExercise(articleId);
    }

    /*
     * ---------- Match Words & Meanings Exercise ----------
     */

    function registerMatch(articleId, items) {
        const usable = usableVocab(items);

        if (usable.length < 3) {
            return false;
        }

        matchState[articleId] = {
            items: usable,
            leftOrder: null,
            rightOrder: null,
            selLeft: null,
            selRight: null,
            matched: {},
            mistakes: 0,
            flash: null
        };

        return true;
    }

    function shuffleMatch(articleId) {
        const state = matchState[articleId];

        if (!state) {
            return;
        }

        const ids = state.items.map(function (item) {
            return item.id;
        });

        state.leftOrder = shuffleArray(ids);
        state.rightOrder = shuffleArray(ids);
        state.selLeft = null;
        state.selRight = null;
        state.matched = {};
        state.mistakes = 0;
        state.flash = null;
    }

    function renderMatchExercise(articleId) {
        const state = matchState[articleId];
        const box = document.getElementById(articleId + "-match");

        if (!state || !box) {
            return;
        }

        const byId = {};

        state.items.forEach(function (item) {
            byId[item.id] = item;
        });

        function cellClass(side, id) {
            let className = "match-item";

            if (state.matched[id]) {
                return className + " matched";
            }

            if (state.flash) {
                if (
                    (side === "left" && state.flash.left === id) ||
                    (side === "right" && state.flash.right === id)
                ) {
                    return className + " wrong";
                }
                return className;
            }

            if (
                (side === "left" && state.selLeft === id) ||
                (side === "right" && state.selRight === id)
            ) {
                className += " selected";
            }

            return className;
        }

        function cellClick(side, id) {
            if (state.matched[id] || state.flash) {
                return "";
            }
            return `onclick="pickMatchItem('${articleId}', '${side}', ${id})"`;
        }

        const total = state.items.length;
        const doneCount = Object.keys(state.matched).length;

        let html = `
            <p class="order-help">
                Click a Korean word, then click its English meaning to match them.
                Correct pairs turn green.
            </p>
            <div class="match-grid">
                <div class="match-col">
                    ${state.leftOrder.map(function (id) {
                        return `<div class="${cellClass("left", id)}" ${cellClick("left", id)}>
                            <span class="match-word">${escapeHtml(byId[id].word)}</span>
                        </div>`;
                    }).join("")}
                </div>
                <div class="match-col">
                    ${state.rightOrder.map(function (id) {
                        return `<div class="${cellClass("right", id)}" ${cellClick("right", id)}>
                            ${escapeHtml(byId[id].meaning)}
                        </div>`;
                    }).join("")}
                </div>
            </div>
        `;

        html += `
            <div class="order-actions">
                <button class="translation-btn" onclick="restartMatch('${articleId}')">
                    🔀 Shuffle Again
                </button>
            </div>
        `;

        if (doneCount === total) {
            let message = "🎉 All " + total + " matched! ";

            if (state.mistakes === 0) {
                message += "No mistakes.";
            } else if (state.mistakes === 1) {
                message += "1 mistake.";
            } else {
                message += state.mistakes + " mistakes.";
            }

            html += `<div class="order-result">${message}</div>`;
        } else {
            html += `
                <div class="order-result">
                    ${doneCount} of ${total} matched · Mistakes: ${state.mistakes}
                </div>
            `;
        }

        box.innerHTML = html;
    }

    function pickMatchItem(articleId, side, id) {
        const state = matchState[articleId];

        if (!state || state.flash || state.matched[id]) {
            return;
        }

        if (side === "left") {
            state.selLeft = state.selLeft === id ? null : id;
        } else {
            state.selRight = state.selRight === id ? null : id;
        }

        if (state.selLeft !== null && state.selRight !== null) {
            if (state.selLeft === state.selRight) {
                // Correct pair.
                state.matched[state.selLeft] = true;
                state.selLeft = null;
                state.selRight = null;
            } else {
                // Wrong pair: flash red briefly, then clear.
                state.mistakes++;
                state.flash = {
                    left: state.selLeft,
                    right: state.selRight
                };
                state.selLeft = null;
                state.selRight = null;

                renderMatchExercise(articleId);

                setTimeout(function () {
                    // Ignore if the list was redrawn in the meantime.
                    if (matchState[articleId] !== state) {
                        return;
                    }
                    state.flash = null;
                    renderMatchExercise(articleId);
                }, 700);

                return;
            }
        }

        renderMatchExercise(articleId);
    }

    function restartMatch(articleId) {
        shuffleMatch(articleId);
        renderMatchExercise(articleId);
    }

    /*
     * ---------- Flashcards (Korean→English, English→Korean, Mixed) ----------
     */

    function registerFlash(articleId, items) {
        const usable = usableVocab(items);

        if (usable.length < 3) {
            return false;
        }

        flashState[articleId] = {
            items: usable,
            mode: "ko2en",
            deck: null,
            flipped: false,
            again: 0,
            total: 0
        };

        return true;
    }

    function startFlash(articleId) {
        const state = flashState[articleId];

        if (!state) {
            return;
        }

        let cards = [];

        state.items.forEach(function (item) {
            if (state.mode !== "en2ko") {
                cards.push({ id: item.id, dir: "ko2en" });
            }

            if (state.mode !== "ko2en") {
                cards.push({ id: item.id, dir: "en2ko" });
            }
        });

        state.deck = separateNeighbors(shuffleArray(cards));
        state.total = state.deck.length;
        state.flipped = false;
        state.again = 0;
    }

    function setFlashMode(articleId, mode) {
        const state = flashState[articleId];

        if (!state) {
            return;
        }

        state.mode = mode;
        startFlash(articleId);
        renderFlash(articleId);
    }

    function renderFlash(articleId) {
        const state = flashState[articleId];
        const box = document.getElementById(articleId + "-flash");

        if (!state || !box) {
            return;
        }

        const byId = {};

        state.items.forEach(function (item) {
            byId[item.id] = item;
        });

        const modes = [
            ["ko2en", "Korean → English"],
            ["en2ko", "English → Korean"],
            ["mixed", "Mixed"]
        ];

        let html = `
            <div class="order-actions" style="margin: 0 0 14px;">
                ${modes.map(function (m) {
                    return `<button
                        class="translation-btn ${state.mode === m[0] ? "mode-active" : ""}"
                        onclick="setFlashMode('${articleId}', '${m[0]}')"
                    >${m[1]}</button>`;
                }).join("")}
            </div>
        `;

        if (state.deck.length === 0) {
            html += `
                <div class="order-result">
                    🎉 Deck complete! You went through all ${state.total} cards.
                    "Again" was pressed ${state.again} time${state.again === 1 ? "" : "s"}.
                </div>
                <div class="order-actions">
                    <button class="translation-btn" onclick="restartFlash('${articleId}')">
                        🔀 Shuffle &amp; Start Over
                    </button>
                </div>
            `;
            box.innerHTML = html;
            return;
        }

        const card = state.deck[0];
        const current = byId[card.id];

        const front = card.dir === "ko2en"
            ? `<div class="flash-word">${escapeHtml(current.word)}</div>`
            : `<div class="flash-word english">${escapeHtml(current.meaning)}</div>`;

        let back = "";

        if (state.flipped) {
            back = card.dir === "ko2en"
                ? `<div class="flash-meaning">${escapeHtml(current.meaning)}</div>`
                : `<div class="flash-meaning flash-korean">${escapeHtml(current.word)}</div>`;

            if (current.example_ko) {
                back += `
                    <div class="flash-example">
                        <div>${exampleHtml(current.example_ko)}</div>
                        ${
                            current.example_en
                                ? `<div class="flash-example-en">${escapeHtml(current.example_en)}</div>`
                                : ""
                        }
                    </div>
                `;
            }
        } else {
            back = `<div class="flash-hint">${
                card.dir === "ko2en"
                    ? "Think of the meaning, then tap to reveal"
                    : "Think of the Korean word, then tap to reveal"
            }</div>`;
        }

        html += `
            <div class="flash-progress">
                Cards left: ${state.deck.length} of ${state.total} · Again: ${state.again}
            </div>
            <div class="flash-card" onclick="flipCard('${articleId}')">
                ${front}
                ${back}
            </div>
        `;

        if (state.flipped) {
            html += `
                <div class="order-actions">
                    <button class="translation-btn flash-btn-got" onclick="flashAnswer('${articleId}', true)">
                        ✓ Got it
                    </button>
                    <button class="translation-btn flash-btn-again" onclick="flashAnswer('${articleId}', false)">
                        ↺ Again
                    </button>
                </div>
            `;
        }

        box.innerHTML = html;
    }

    function flipCard(articleId) {
        const state = flashState[articleId];

        if (!state || !state.deck || state.deck.length === 0) {
            return;
        }

        state.flipped = !state.flipped;
        renderFlash(articleId);
    }

    function flashAnswer(articleId, gotIt) {
        const state = flashState[articleId];

        if (!state || !state.deck || state.deck.length === 0) {
            return;
        }

        const card = state.deck.shift();

        if (!gotIt) {
            state.again++;
            // The card comes back in the same direction.
            state.deck.push(card);
        }

        state.flipped = false;
        renderFlash(articleId);
    }

    function restartFlash(articleId) {
        startFlash(articleId);
        renderFlash(articleId);
    }

    /*
     * ---------- Vocab Quiz (multiple choice, both directions) ----------
     */

    function registerQuiz(articleId, items) {
        const usable = usableVocab(items);

        // Need at least 4 words to make four choices.
        if (usable.length < 4) {
            return false;
        }

        quizState[articleId] = {
            items: usable,
            questions: null,
            qIndex: 0,
            options: [],
            wrong: {},
            hadError: false,
            locked: false,
            errors: 0,
            firstTry: 0,
            missed: {},
            done: false,
            reviewing: false
        };

        return true;
    }

    function setQuizQuestion(state) {
        const q = state.questions[state.qIndex];
        const key = q.dir === "ko2en" ? "meaning" : "word";

        const correct = state.items.filter(function (item) {
            return item.id === q.id;
        })[0];

        const seen = {};
        seen[correct[key]] = true;

        const distractors = [];

        shuffleArray(
            state.items.filter(function (item) {
                return item.id !== q.id;
            })
        ).forEach(function (item) {
            if (distractors.length < 3 && !seen[item[key]]) {
                seen[item[key]] = true;
                distractors.push(item.id);
            }
        });

        state.options = shuffleArray([q.id].concat(distractors));
        state.wrong = {};
        state.hadError = false;
        state.locked = false;
    }

    function startQuiz(articleId, onlyIds) {
        const state = quizState[articleId];

        if (!state) {
            return;
        }

        const ids = onlyIds && onlyIds.length
            ? onlyIds
            : state.items.map(function (item) {
                return item.id;
            });

        let qs = [];

        ids.forEach(function (id) {
            qs.push({ id: id, dir: "ko2en" });
            qs.push({ id: id, dir: "en2ko" });
        });

        state.questions = separateNeighbors(shuffleArray(qs));
        state.qIndex = 0;
        state.errors = 0;
        state.firstTry = 0;
        state.missed = {};
        state.done = false;
        state.reviewing = !!(onlyIds && onlyIds.length);

        setQuizQuestion(state);
    }

    function renderQuiz(articleId) {
        const state = quizState[articleId];
        const box = document.getElementById(articleId + "-quiz");

        if (!state || !box || !state.questions) {
            return;
        }

        const byId = {};

        state.items.forEach(function (item) {
            byId[item.id] = item;
        });

        const total = state.questions.length;

        if (state.done) {
            const missedItems = state.items.filter(function (item) {
                return state.missed[item.id];
            });

            let html = `
                <div class="quiz-bar"><div class="quiz-bar-fill" style="width:100%"></div></div>
                <div class="order-result">
                    ${state.errors === 0 ? "🎉 Perfect run!" : "Quiz complete!"}
                    ${state.reviewing ? "(Review round)" : ""}
                </div>
                <div class="order-result">
                    Mistakes: ${state.errors} ·
                    Right on first try: ${state.firstTry} of ${total}
                </div>
            `;

            if (missedItems.length) {
                html += `
                    <div class="quiz-missed">
                        <strong>Words to review:</strong>
                        ${missedItems.map(function (item) {
                            return `<div>${escapeHtml(item.word)} — ${escapeHtml(item.meaning)}</div>`;
                        }).join("")}
                    </div>
                `;
            }

            html += `
                <div class="order-actions">
                    <button class="translation-btn" onclick="retryQuiz('${articleId}')">
                        🔀 New Full Quiz
                    </button>
                    ${
                        missedItems.length
                            ? `<button class="translation-btn" onclick="reviewMissedQuiz('${articleId}')">
                                   📝 Review Missed Words
                               </button>`
                            : ""
                    }
                </div>
            `;

            box.innerHTML = html;
            return;
        }

        const q = state.questions[state.qIndex];
        const item = byId[q.id];
        const key = q.dir === "ko2en" ? "meaning" : "word";

        const percent = Math.round((state.qIndex / total) * 100);

        let html = `
            <div class="quiz-bar"><div class="quiz-bar-fill" style="width:${percent}%"></div></div>
            <div class="quiz-status">
                Question ${state.qIndex + 1} of ${total} · Mistakes: ${state.errors}
                ${state.reviewing ? " · Review round" : ""}
            </div>
            <div class="quiz-label">
                ${q.dir === "ko2en" ? "What does this mean?" : "Which Korean word matches?"}
            </div>
            <div class="quiz-prompt ${q.dir === "ko2en" ? "" : "english"}">
                ${escapeHtml(q.dir === "ko2en" ? item.word : item.meaning)}
            </div>
        `;

        state.options.forEach(function (optId, i) {
            let className = "quiz-option";

            if (state.wrong[optId]) {
                className += " wrong";
            } else if (state.locked && optId === q.id) {
                className += " correct";
            }

            const clickAttr = (state.locked || state.wrong[optId])
                ? ""
                : `onclick="pickQuizOption('${articleId}', ${optId})"`;

            html += `
                <button class="${className}" ${clickAttr}>
                    <span class="quiz-num">${i + 1}</span>${escapeHtml(byId[optId][key])}
                </button>
            `;
        });

        box.innerHTML = html;
    }

    function pickQuizOption(articleId, optId) {
        const state = quizState[articleId];

        if (!state || state.done || state.locked || state.wrong[optId]) {
            return;
        }

        const q = state.questions[state.qIndex];

        if (optId === q.id) {
            state.locked = true;

            if (!state.hadError) {
                state.firstTry++;
            }

            renderQuiz(articleId);

            setTimeout(function () {
                // Ignore if the list was redrawn or the quiz restarted.
                if (quizState[articleId] !== state || !state.locked) {
                    return;
                }

                state.qIndex++;

                if (state.qIndex >= state.questions.length) {
                    state.done = true;
                } else {
                    setQuizQuestion(state);
                }

                renderQuiz(articleId);
            }, QUIZ_ADVANCE_MS);
        } else {
            state.wrong[optId] = true;
            state.errors++;

            if (!state.hadError) {
                state.hadError = true;
                state.missed[q.id] = true;
            }

            renderQuiz(articleId);
        }
    }

    function retryQuiz(articleId) {
        startQuiz(articleId, null);
        renderQuiz(articleId);
    }

    function reviewMissedQuiz(articleId) {
        const state = quizState[articleId];

        if (!state) {
            return;
        }

        const ids = Object.keys(state.missed).map(Number);

        startQuiz(articleId, ids);
        renderQuiz(articleId);
    }

    // Keyboard shortcuts: press 1-4 to answer the open quiz.
    document.addEventListener("keydown", function (event) {
        if (!activeQuizId) {
            return;
        }

        const tag = (event.target.tagName || "").toLowerCase();

        if (tag === "input" || tag === "textarea" || tag === "select") {
            return;
        }

        const n = parseInt(event.key, 10);

        if (!(n >= 1 && n <= 4)) {
            return;
        }

        const state = quizState[activeQuizId];
        const box = document.getElementById(activeQuizId + "-quiz");

        if (
            !state ||
            !box ||
            box.style.display === "none" ||
            state.done ||
            !state.options ||
            n > state.options.length
        ) {
            return;
        }

        pickQuizOption(activeQuizId, state.options[n - 1]);
    });

    /*
     * ---------- Fill in the Blank (uses [bracketed] example sentences) ----------
     */

    function registerFill(articleId, items) {
        const usable = usableVocab(items).filter(function (item) {
            return /\[[^\]]+\]/.test(item.example_ko);
        });

        // Re-number so IDs are 0..n-1 for this exercise.
        usable.forEach(function (item, i) {
            item.id = i;
        });

        if (usable.length < 3) {
            return false;
        }

        fillState[articleId] = {
            items: usable,
            order: null,
            bank: null,
            answers: {},
            sel: null,
            checked: false
        };

        return true;
    }

    function startFill(articleId) {
        const state = fillState[articleId];

        if (!state) {
            return;
        }

        const ids = state.items.map(function (item) {
            return item.id;
        });

        state.order = shuffleArray(ids);
        state.bank = shuffleArray(ids);
        state.answers = {};
        state.sel = null;
        state.checked = false;
    }

    function fillUsedIds(state) {
        return Object.keys(state.answers).map(function (k) {
            return state.answers[k];
        });
    }

    function renderFill(articleId) {
        const state = fillState[articleId];
        const box = document.getElementById(articleId + "-fill");

        if (!state || !box) {
            return;
        }

        const byId = {};

        state.items.forEach(function (item) {
            byId[item.id] = item;
        });

        const used = fillUsedIds(state);
        let score = 0;

        let html = `
            <p class="order-help">
                Tap a word, then tap a blank to place it. The blank hides the
                word in the form used in the sentence. Tap a filled blank to
                remove the word.
            </p>
            <div class="fill-bank">
                ${state.bank.map(function (id) {
                    let className = "fill-chip";

                    if (used.indexOf(id) !== -1) {
                        className += " used";
                    } else if (state.sel === id) {
                        className += " selected";
                    }

                    const clickAttr = (state.checked || used.indexOf(id) !== -1)
                        ? ""
                        : `onclick="pickFillChip('${articleId}', ${id})"`;

                    return `<span class="${className}" ${clickAttr}>${escapeHtml(byId[id].word)}</span>`;
                }).join("")}
            </div>
        `;

        state.order.forEach(function (id, qi) {
            const item = byId[id];
            const match = item.example_ko.match(/\[([^\]]+)\]/);

            const before = item.example_ko
                .slice(0, match.index)
                .replace(/[\[\]]/g, "");
            const after = item.example_ko
                .slice(match.index + match[0].length)
                .replace(/[\[\]]/g, "");

            const answer = state.answers[qi];
            const hasAnswer = answer !== undefined;

            let slotClass = "fill-slot";
            let slotText = "(tap)";
            let qClass = "fill-question";
            let feedback = "";

            if (hasAnswer) {
                slotClass += " filled";
                slotText = byId[answer].word;
            }

            if (state.checked) {
                if (hasAnswer && answer === id) {
                    score++;
                    slotClass = "fill-slot ok";
                    qClass += " correct";
                    feedback = `<div class="fill-feedback ok">✅ Correct — ${escapeHtml(match[1])}</div>`;
                } else {
                    slotClass = "fill-slot bad";
                    qClass += " wrong";
                    feedback = `<div class="fill-feedback bad">❌ Answer: ${escapeHtml(item.word)} (${escapeHtml(match[1])})</div>`;
                }
            }

            const slotClick = state.checked
                ? ""
                : `onclick="pickFillSlot('${articleId}', ${qi})"`;

            html += `
                <div class="${qClass}">
                    <div>
                        ${qi + 1}. ${escapeHtml(before)}<span class="${slotClass}" ${slotClick}>${escapeHtml(slotText)}</span>${escapeHtml(after)}
                    </div>
                    ${
                        item.example_en
                            ? `<div class="example-en">${escapeHtml(item.example_en)}</div>`
                            : ""
                    }
                    ${feedback}
                </div>
            `;
        });

        html += `
            <div class="order-actions">
                <button class="translation-btn" onclick="checkFill('${articleId}')">
                    ✓ Check Answers
                </button>
                <button class="translation-btn" onclick="restartFill('${articleId}')">
                    🔀 Shuffle Again
                </button>
            </div>
        `;

        if (state.checked) {
            html += `
                <div class="order-result">
                    ${score === state.items.length ? "🎉 " : ""}Score: ${score} / ${state.items.length}
                </div>
            `;
        }

        box.innerHTML = html;
    }

    function pickFillChip(articleId, id) {
        const state = fillState[articleId];

        if (!state || state.checked) {
            return;
        }

        state.sel = state.sel === id ? null : id;
        renderFill(articleId);
    }

    function pickFillSlot(articleId, qi) {
        const state = fillState[articleId];

        if (!state || state.checked) {
            return;
        }

        if (state.sel !== null) {
            // Remove this word from any other blank first.
            Object.keys(state.answers).forEach(function (k) {
                if (state.answers[k] === state.sel) {
                    delete state.answers[k];
                }
            });

            state.answers[qi] = state.sel;
            state.sel = null;
        } else if (state.answers[qi] !== undefined) {
            delete state.answers[qi];
        }

        renderFill(articleId);
    }

    function checkFill(articleId) {
        const state = fillState[articleId];

        if (!state) {
            return;
        }

        state.checked = true;
        state.sel = null;
        renderFill(articleId);
    }

    function restartFill(articleId) {
        startFill(articleId);
        renderFill(articleId);
    }

    /*
     * ---------- Rendering the article list ----------
     */

    function renderArticles() {
        const container = document.getElementById(
            "articles-container"
        );

        if (!container) {
            return;
        }

        // Reset all exercises whenever the list is redrawn.
        orderState = {};
        matchState = {};
        flashState = {};
        quizState = {};
        fillState = {};
        practiceKeys = {};
        practiceCurrent = {};
        activeQuizId = null;

        if (!filteredArticles.length) {
            const emptyMessage = currentCategory === "converted"
                ? "No converted lessons yet. Convert an article and it will appear here automatically."
                : "No articles found.";

            container.innerHTML = `
                <div class="loading">
                    ${emptyMessage}
                </div>
            `;

            document.getElementById(
                "load-more-btn"
            ).style.display = "none";

            return;
        }

        const articlesToShow = filteredArticles.slice(
            0,
            displayedCount
        );

        container.innerHTML = articlesToShow.map(function (article, index) {

            const articleId =
                "article-" +
                index +
                "-" +
                Math.random().toString(36).substring(2, 8);

            const title = escapeHtml(
                article.title || "Untitled Article"
            );

            const body = escapeHtml(
                article.body || article.content || ""
            ).replace(/\n/g, "<br>");

            const translation = escapeHtml(
                article.translation ||
                article.english_translation ||
                ""
            ).replace(/\n/g, "<br>");

            // ----- Vocabulary + example sentences -----

            const vocabItems = getVocabItems(article);

            let vocabularyHtml = "";

            if (vocabItems.length) {
                const examples = vocabItems.filter(function (item) {
                    return item.example_ko;
                });

                let examplesHtml = "";

                if (examples.length) {
                    examplesHtml = `
                        <div class="translation-toggle">

                            <button
                                id="${articleId}-examples-btn"
                                class="translation-btn"
                                onclick="toggleExamples('${articleId}')"
                            >
                                Show Example Sentences
                            </button>

                            <div
                                id="${articleId}-examples"
                                class="translation-box"
                                style="display:none;"
                            >
                                ${examples.map(function (item) {
                                    return `
                                        <div class="example-item">
                                            <div class="example-ko">${exampleHtml(item.example_ko)}</div>
                                            ${
                                                item.example_en
                                                    ? `<div class="example-en">${escapeHtml(item.example_en)}</div>`
                                                    : ""
                                            }
                                        </div>
                                    `;
                                }).join("")}
                            </div>

                        </div>
                    `;
                }

                vocabularyHtml = `
                    <div class="vocab-section">
                        <h3>Key Vocabulary</h3>

                        <ul class="vocab-list">
                            ${vocabItems.map(function (item) {
                                return `
                                    <li class="vocab-item" data-word="${escapeHtml(item.word)}" data-meaning="${escapeHtml(item.meaning)}">
                                        <strong class="word">${escapeHtml(item.word)}</strong>
                                        <span class="meaning">${
                                            item.meaning
                                                ? " — " + escapeHtml(item.meaning)
                                                : ""
                                        }</span>
                                    </li>
                                `;
                            }).join("")}
                        </ul>

                        ${examplesHtml}
                    </div>
                `;
            }

            // ----- Translation -----

            let translationHtml = "";

            if (translation) {
                translationHtml = `
                    <div class="translation-toggle">

                        <button
                            id="${articleId}-translation-btn"
                            class="translation-btn"
                            onclick="toggleTranslation('${articleId}')"
                        >
                            Show English Translation
                        </button>

                        <div
                            id="${articleId}-translation"
                            class="translation-box"
                            style="display:none;"
                        >
                            ${translation}
                        </div>

                    </div>
                `;
            }

            // ----- Practice panel -----

            const tabs = [];

            // Sentence Order (first N sentences, first one fixed).
            const allSentences = splitKoreanSentences(
                article.body || article.content || ""
            );

            if (allSentences.length >= 3) {
                orderState[articleId] = {
                    correct: allSentences.slice(0, ORDER_SENTENCE_COUNT),
                    current: null,
                    selected: null,
                    checked: false
                };

                tabs.push(["order", "🔀 Sentence Order"]);
            }

            if (registerMatch(articleId, vocabItems)) {
                tabs.push(["match", "🔗 Match"]);
            }

            if (registerFlash(articleId, vocabItems)) {
                tabs.push(["flash", "🃏 Flashcards"]);
            }

            if (registerQuiz(articleId, vocabItems)) {
                tabs.push(["quiz", "⚡ Quiz"]);
            }

            if (registerFill(articleId, vocabItems)) {
                tabs.push(["fill", "✏️ Fill in the Blank"]);
            }

            let practiceHtml = "";

            if (tabs.length) {
                practiceKeys[articleId] = tabs.map(function (t) {
                    return t[0];
                });

                practiceHtml = `
                    <div class="practice-section">

                        <button
                            id="${articleId}-practice-btn"
                            class="practice-main-btn"
                            onclick="togglePractice('${articleId}')"
                        >
                            🎯 Practice
                        </button>

                        <div id="${articleId}-practice" style="display:none;">

                            <div class="practice-tabs">
                                ${tabs.map(function (t) {
                                    return `<button
                                        id="${articleId}-tab-${t[0]}"
                                        class="practice-tab"
                                        onclick="showPracticeTab('${articleId}', '${t[0]}')"
                                    >${t[1]}</button>`;
                                }).join("")}
                            </div>

                            ${tabs.map(function (t) {
                                return `<div
                                    id="${articleId}-${t[0]}"
                                    class="translation-box"
                                    style="display:none;"
                                ></div>`;
                            }).join("")}

                        </div>

                    </div>
                `;
            }

            return `
                <article class="news-card">

                    <div class="news-meta">
                        ${escapeHtml(categoryLabel(article.category))}

                        ${
                           article.published_at || article.date
    ? " · " + formatDate(article.date, article.published_at)
    : ""
                        }
                    </div>

                    <h2 class="news-title">
                        ${title}
                    </h2>

                    <div class="audio-controls">

                        <button
                            class="audio-btn"
                            onclick="
                                speakArticle(
                                    '${articleId}',
                                    document.getElementById('${articleId}-text').innerText,
                                    this
                                )
                            "
                        >
                            ▶ Listen
                        </button>

                        <button
                            class="audio-btn"
                            onclick="pauseSpeech()"
                        >
                            ⏸ Pause
                        </button>

                        <button
                            class="audio-btn"
                            onclick="resumeSpeech()"
                        >
                            ▶ Resume
                        </button>

                        <button
                            class="audio-btn"
                            onclick="stopSpeech()"
                        >
                            ■ Stop
                        </button>

                        <select
                            id="${articleId}-speed"
                            class="speed-select"
                        >
                            <option value="0.75">0.75×</option>
                            <option value="0.9">0.9×</option>
                            <option value="1" selected>1×</option>
                            <option value="1.15">1.15×</option>
                            <option value="1.25">1.25×</option>
                            <option value="1.5">1.5×</option>
                        </select>

                    </div>

                    <div
                        id="${articleId}-text"
                        class="news-body"
                    >
                        <p>
                            ${body}
                        </p>
                    </div>

                    <button
                        class="select-text-btn"
                        onclick="selectArticleText('${articleId}-text', this)"
                    >
                        📋 Select All Korean
                    </button>

                    ${translationHtml}

                    ${vocabularyHtml}

                    ${practiceHtml}

                </article>
            `;
        }).join("");

        const loadMoreButton = document.getElementById(
            "load-more-btn"
        );

        if (displayedCount < filteredArticles.length) {
            loadMoreButton.style.display = "inline-block";
        } else {
            loadMoreButton.style.display = "none";
        }
    }

    function updateArchiveCount() {
        const countElement = document.getElementById(
            "archive-count"
        );

        if (!countElement) {
            return;
        }

        if (currentCategory === "converted") {
            countElement.textContent =
                convertedArticles.length +
                " converted lessons";
        } else {
            countElement.textContent =
                allArticles.length +
                " archived articles";
        }
    }

    // Loads converted_data.json. A missing or empty file is not an error.
    async function loadConverted() {
        try {
            const response = await fetch(
                "converted_data.json?" + Date.now()
            );

            if (!response.ok) {
                convertedArticles = [];
                return;
            }

            const data = await response.json();

            if (Array.isArray(data)) {
                convertedArticles = data;
            } else if (Array.isArray(data.articles)) {
                convertedArticles = data.articles;
            } else {
                convertedArticles = [];
            }

        } catch (error) {
            console.error(error);
            convertedArticles = [];
        }
    }

    async function loadNews() {
        const container = document.getElementById(
            "articles-container"
        );

        try {
            const response = await fetch(
                "news_data.json?" + Date.now()
            );

            if (!response.ok) {
                throw new Error(
                    "Failed to load news data."
                );
            }

            const data = await response.json();

            if (Array.isArray(data)) {
                allArticles = data;
            } else if (Array.isArray(data.articles)) {
                allArticles = data.articles;
            } else {
                allArticles = [];
            }

            await loadConverted();

            updateArchiveCount();

            filteredArticles = allArticles;

            renderArticles();

        } catch (error) {
            console.error(error);

            container.innerHTML = `
                <div class="error-message">
                    Unable to load the news articles.
                    Please try again later.
                </div>
            `;
        }
    }

    document.querySelectorAll(".category-btn").forEach(
        function (button) {

            button.addEventListener("click", function () {

                document
                    .querySelectorAll(".category-btn")
                    .forEach(function (btn) {
                        btn.classList.remove("active");
                    });

                button.classList.add("active");

                currentCategory =
                    button.dataset.category;

                displayedCount = 10;

                if (currentCategory === "all") {

                    filteredArticles = allArticles;

                } else if (currentCategory === "converted") {

                    filteredArticles = convertedArticles;

                } else {

                    filteredArticles =
                        allArticles.filter(function (article) {

                            return String(
                                article.category || ""
                            ).toLowerCase() ===
                            currentCategory.toLowerCase();

                        });

                }

                updateArchiveCount();
                renderArticles();
            });
        }
    );

    document
        .getElementById("load-more-btn")
        .addEventListener("click", function () {

            displayedCount += 10;

            renderArticles();
        });

    loadNews();
</script>
