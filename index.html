<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jason's TOPIK News Study</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f5f7fa;
            --card-color: #ffffff;
            --text-color: #222222;
            --muted-color: #777777;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --border-color: #e5e7eb;
            --green-color: #15803d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Noto Sans KR", Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
        }

        .container {
            width: min(100% - 32px, 900px);
            margin: 0 auto;
        }

        header {
            background: var(--card-color);
            border-bottom: 1px solid var(--border-color);
            padding: 28px 0 22px;
        }

        header h1 {
            margin: 0 0 6px;
            font-size: 2rem;
        }

        header p {
            margin: 0;
            color: var(--muted-color);
            font-size: 0.95rem;
        }

        .header-links {
            margin-top: 14px;
        }

        .header-links a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
        }

        .header-links a:hover {
            text-decoration: underline;
        }

        .category-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 24px 0;
        }

        .category-btn {
            border: 1px solid var(--border-color);
            background: white;
            color: #444;
            padding: 8px 14px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .category-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .category-btn.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .archive-count {
            color: var(--muted-color);
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        .news-card {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 7px rgba(0, 0, 0, 0.03);
        }

        .news-meta {
            color: var(--muted-color);
            font-size: 0.82rem;
            margin-bottom: 8px;
        }

        .news-title {
            font-size: 1.45rem;
            line-height: 1.45;
            margin: 0 0 16px;
        }

        .audio-controls {
            display: flex;
            gap: 7px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .audio-btn {
            border: 1px solid var(--border-color);
            background: white;
            color: #333;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.84rem;
        }

        .audio-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .speed-select {
            border: 1px solid var(--border-color);
            background: white;
            padding: 7px 9px;
            border-radius: 6px;
            font-size: 0.84rem;
        }

        .news-body {
            font-size: 1.02rem;
            line-height: 1.9;
        }

        .news-body p {
            margin: 0;
        }

        .select-text-btn {
            margin-top: 14px;
            margin-bottom: 20px;
            border: 1px solid var(--accent-color);
            background: white;
            color: var(--accent-color);
            padding: 7px 13px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .select-text-btn:hover {
            background: var(--accent-color);
            color: white;
        }

        .vocab-section {
            margin-top: 8px;
            padding-top: 18px;
            border-top: 1px solid var(--border-color);
        }

        .vocab-section h3 {
            margin: 0 0 12px;
            font-size: 1rem;
        }

        .vocab-list {
            margin: 0;
            padding-left: 22px;
        }

        .vocab-list li {
            margin-bottom: 7px;
        }

        .translation-toggle {
            margin-top: 18px;
        }

        .translation-btn {
            border: 1px solid var(--border-color);
            background: white;
            color: #444;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.84rem;
            font-family: inherit;
        }

        .translation-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .translation-btn.mode-active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: white;
        }

        .translation-box {
            margin-top: 12px;
            padding: 16px;
            background: #f8fafc;
            border-left: 3px solid var(--accent-color);
            border-radius: 5px;
            line-height: 1.8;
        }

        .load-more-container {
            text-align: center;
            margin: 28px 0 50px;
        }

        .load-more-btn {
            border: 1px solid var(--accent-color);
            background: var(--accent-color);
            color: white;
            padding: 10px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .load-more-btn:hover {
            background: var(--accent-hover);
        }

        .loading,
        .error-message {
            text-align: center;
            padding: 50px 20px;
            color: var(--muted-color);
        }

        .error-message {
            color: #b91c1c;
        }

        footer {
            border-top: 1px solid var(--border-color);
            padding: 28px 0;
            color: var(--muted-color);
            font-size: 0.8rem;
            text-align: center;
        }

        /* ---------- Example Sentences ---------- */

        .example-item {
            margin-bottom: 14px;
        }

        .example-item:last-child {
            margin-bottom: 0;
        }

        .example-ko {
            font-weight: 500;
        }

        .example-ko strong {
            color: var(--accent-color);
        }

        .example-en {
            color: var(--muted-color);
            font-size: 0.93rem;
        }

        /* ---------- Practice panel ---------- */

        .practice-section {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid var(--border-color);
        }

        .practice-main-btn {
            border: 1px solid var(--accent-color);
            background: var(--accent-color);
            color: white;
            padding: 9px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            font-family: inherit;
        }

        .practice-main-btn:hover {
            background: var(--accent-hover);
        }

        .practice-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        .practice-tab {
            border: 1px solid var(--border-color);
            background: white;
            color: #444;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.84rem;
            font-family: inherit;
        }

        .practice-tab:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .practice-tab.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: white;
        }

        /* ---------- Sentence Order Exercise ---------- */

        .order-help {
            margin: 0 0 12px;
            font-size: 0.85rem;
            color: var(--muted-color);
        }

        .order-fixed {
            padding: 10px 14px;
            margin-bottom: 8px;
            background: #eef2ff;
            border: 1px solid #c7d2fe;
            border-radius: 7px;
            line-height: 1.8;
        }

        .order-item {
            padding: 10px 14px;
            margin-bottom: 8px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 7px;
            cursor: pointer;
            line-height: 1.8;
        }

        .order-item:hover {
            border-color: var(--accent-color);
        }

        .order-item.selected {
            border-color: var(--accent-color);
            background: #dbeafe;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.25);
        }

        .order-item.correct {
            border-color: var(--green-color);
            background: #f0fdf4;
            cursor: default;
        }

        .order-item.wrong {
            border-color: #b91c1c;
            background: #fef2f2;
            cursor: default;
        }

        .order-label {
            display: inline-block;
            min-width: 22px;
            margin-right: 6px;
            font-weight: 700;
            color: var(--accent-color);
        }

        .order-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .order-result {
            margin-top: 14px;
            font-weight: 500;
        }

        .order-answer {
            margin-top: 12px;
            padding: 12px 14px;
            background: #f8fafc;
            border-left: 3px solid var(--green-color);
            border-radius: 5px;
            font-size: 0.95rem;
            line-height: 1.8;
        }

        .order-answer div {
            margin-bottom: 4px;
        }

        /* ---------- Match Words & Meanings Exercise ---------- */

        .match-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 12px;
        }

        .match-col {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .match-item {
            padding: 10px 14px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 7px;
            cursor: pointer;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .match-item:hover {
            border-color: var(--accent-color);
        }

        .match-item.selected {
            border-color: var(--accent-color);
            background: #dbeafe;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.25);
        }

        .match-item.matched {
            border-color: var(--green-color);
            background: #f0fdf4;
            color: var(--green-color);
            cursor: default;
        }

        .match-item.wrong {
            border-color: #b91c1c;
            background: #fef2f2;
            cursor: default;
        }

        .match-word {
            font-weight: 700;
            font-size: 1.02rem;
        }

        /* ---------- Flashcards ---------- */

        .flash-progress {
            font-size: 0.85rem;
            color: var(--muted-color);
            margin-bottom: 10px;
        }

        .flash-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .flash-card:hover {
            border-color: var(--accent-color);
        }

        .flash-word {
            font-size: 1.7rem;
            font-weight: 700;
        }

        .flash-word.english {
            font-size: 1.3rem;
        }

        .flash-meaning {
            font-size: 1.1rem;
            color: var(--accent-color);
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
            width: 100%;
        }

        .flash-meaning.flash-korean {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .flash-example {
            width: 100%;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .flash-example strong {
            color: var(--accent-color);
        }

        .flash-example-en {
            color: var(--muted-color);
            font-size: 0.88rem;
        }

        .flash-hint {
            font-size: 0.8rem;
            color: var(--muted-color);
        }

        .flash-btn-got {
            border-color: var(--green-color);
            color: var(--green-color);
        }

        .flash-btn-again {
            border-color: #b91c1c;
            color: #b91c1c;
        }

        /* ---------- Vocab Quiz ---------- */

        .quiz-bar {
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .quiz-bar-fill {
            height: 100%;
            background: var(--accent-color);
            transition: width 0.3s;
        }

        .quiz-status {
            font-size: 0.85rem;
            color: var(--muted-color);
            margin-bottom: 14px;
        }

        .quiz-label {
            font-size: 0.85rem;
            color: var(--muted-color);
            margin-bottom: 4px;
        }

        .quiz-prompt {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .quiz-prompt.english {
            font-size: 1.25rem;
        }

        .quiz-option {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px 14px;
            margin-bottom: 8px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
            line-height: 1.5;
        }

        .quiz-option:hover {
            border-color: var(--accent-color);
        }

        .quiz-option.correct {
            border-color: var(--green-color);
            background: #f0fdf4;
            color: var(--green-color);
            cursor: default;
        }

        .quiz-option.wrong {
            border-color: #b91c1c;
            background: #fef2f2;
            color: #b91c1c;
            cursor: default;
        }

        .quiz-num {
            display: inline-block;
            min-width: 22px;
            font-weight: 700;
            color: var(--muted-color);
        }

        .quiz-missed {
            margin-top: 12px;
            padding: 12px 14px;
            background: white;
            border-left: 3px solid #b91c1c;
            border-radius: 5px;
            font-size: 0.95rem;
            line-height: 1.8;
        }

        /* ---------- Fill in the Blank ---------- */

        .fill-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px;
            background: #edf2f7;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .fill-chip {
            background: white;
            border: 2px solid #cbd5e0;
            padding: 6px 12px;
            border-radius: 18px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            user-select: none;
        }

        .fill-chip:hover {
            border-color: var(--accent-color);
        }

        .fill-chip.selected {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: white;
        }

        .fill-chip.used {
            opacity: 0.4;
            cursor: default;
            background: #e2e8f0;
        }

        .fill-question {
            padding: 12px 14px;
            margin-bottom: 10px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .fill-question.correct {
            border-color: var(--green-color);
        }

        .fill-question.wrong {
            border-color: #b91c1c;
        }

        .fill-slot {
            display: inline-block;
            min-width: 90px;
            padding: 2px 10px;
            margin: 0 3px;
            border-bottom: 2px dashed #a0aec0;
            background: #edf2f7;
            color: #a0aec0;
            text-align: center;
            cursor: pointer;
            border-radius: 4px;
            font-weight: 700;
        }

        .fill-slot.filled {
            border-bottom: 2px solid var(--accent-color);
            background: #ebf8ff;
            color: var(--accent-color);
        }

        .fill-slot.ok {
            border-bottom-color: var(--green-color);
            background: #f0fdf4;
            color: var(--green-color);
            cursor: default;
        }

        .fill-slot.bad {
            border-bottom-color: #b91c1c;
            background: #fef2f2;
            color: #b91c1c;
            cursor: default;
        }

        .fill-feedback {
            font-size: 0.88rem;
            margin-top: 4px;
            font-weight: 500;
        }

        .fill-feedback.ok {
            color: var(--green-color);
        }

        .fill-feedback.bad {
            color: #b91c1c;
        }

        @media (max-width: 600px) {
            .container {
                width: min(100% - 22px, 900px);
            }

            header h1 {
                font-size: 1.65rem;
            }

            .news-card {
                padding: 18px;
            }

            .news-title {
                font-size: 1.25rem;
            }

            .news-body {
                font-size: 0.98rem;
            }

            .match-item {
                padding: 9px 10px;
                font-size: 0.88rem;
            }
